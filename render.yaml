services:
  - type: web
    name: saansathi-anurag-demo
    runtime: python
    plan: free
    autoDeployTrigger: off
    buildCommand: python -m py_compile app.py
    startCommand: python app.py
    healthCheckPath: /
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1
      - key: NEBIUS_MODEL
        value: nvidia/Nemotron-3_5-Lightning
